<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register — K Explore</title>
  <meta name="description" content="Register for an event on K Explore." />
  <link rel="stylesheet" href="css/style.css" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%237c3aed'/%3E%3Ctext x='50' y='68' font-family='Arial' font-size='52' font-weight='bold' fill='white' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E" />
</head>
<body>

  <!-- Header / Navigation -->
  <header class="header scrolled" id="header">
    <nav class="nav container">
      <a href="index.html" class="logo">
        <span class="logo__mark">K</span>
        <span class="logo__text">K <span>Explore</span></span>
      </a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html#home">Home</a></li>
        <li><a href="index.html#events">Events</a></li>
        <li><a href="index.html#categories">Categories</a></li>
        <li><a href="index.html#about">About</a></li>
        <li><a href="index.html#contact">Contact</a></li>
        <li><a href="register.html">Register</a></li>
      </ul>
      <div class="nav-actions">
        <button id="themeToggle" aria-label="Toggle theme">🌙</button>
        <button id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <!-- Registration page -->
  <section class="register-page">
    <div class="container">
      <div class="register-wrap">
        <div class="section-head">
          <h2>Register for an Event</h2>
          <p>Fill in your details below to reserve your spot. It only takes a minute.</p>
        </div>

        <div id="confirmation"></div>

        <div id="formWrap">
          <form class="form-card" id="registerForm" novalidate>
            <div class="form-group">
              <label for="regName">Participant Name</label>
              <input type="text" id="regName" name="name" placeholder="e.g. Jane Doe" />
            </div>
            <div class="form-group">
              <label for="regEmail">Email Address</label>
              <input type="email" id="regEmail" name="email" placeholder="e.g. jane@example.com" />
            </div>
            <div class="form-group">
              <label for="regPhone">Phone Number</label>
              <input type="tel" id="regPhone" name="phone" placeholder="e.g. +1 555 012 3456" />
            </div>
            <div class="form-group">
              <label for="eventSelect">Select Event</label>
              <select id="eventSelect" name="eventSelect">
                <option value="">Select an event</option>
              </select>
            </div>
            <button type="submit" class="btn btn--primary">Confirm Registration</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <script type="module" src="js/events.js"></script>
  <script type="module" src="js/script.js"></script>
</body>
</html>
